vars:
  # TARGET_VERSION: 140Xv0E6

# Where plots will be published
target_dir: "/Users/cerminar/CERNbox/www/plots/CTL1_valid_${TARGET_VERSION}/"

# Optional text override for draw_config.additional_text.
# Format: [x_ndc, y_ndc, text]
# Can also be overridden per input definition under inputs.<name>.additional_text.
additional_text:
  - [0.13, 0.91, "#scale[1.5]{CMS} #it{#scale[1.]{Phase-2 Simulation}}"]
  - [0.69, 0.91, "#it{14TeV}, ${TARGET_LABEL}"]

# Combined version→label sets for clarity
sets:
  validation_151X:
    # "140Xv0D0": "151X-vanilla"
    "140Xv0E8": "151X-AR2025"
    # "140Xv0F0": "151Xpre4"
    "140Xv1F5": "l1ct-151x-v1.4.3"
    "${TARGET_VERSION}": "${TARGET_LABEL}"
  # validation_151X:
  #   # "140Xv0E8": "151X-AR2025"
  #   "140Xv0F1": "l1ct-151x-v1.3-oldIN"
  #   "${TARGET_VERSION}": "${TARGET_LABEL}"


# Reusable input lists (filename.root:Label)
inputs:
  nomatch_ele_files:
    template: "plots/histos_doubleele_flat1to100_PU200_egplots_v160A.${VERSION}.root"
    set_ref: validation_151X

  gen_match_ele_files:
    template: "plots/histos_doubleele_flat1to100_PU200_eg_v200D.${VERSION}.root"
    set_ref: validation_151X

  gen_match_menu_ele_files:
    template: "plots/histos_doubleele_flat1to100_PU200_egmenu_v200D.${VERSION}.root"
    set_ref: validation_151X

  nugun_ratemenu_files:
    template: "plots/histos_nugun_alleta_pu200_egratemenu_v200C.${VERSION}.root"
    set_ref: validation_151X

  nugun_egratecount_files:
    template: "plots/histos_nugun_alleta_pu200_egratecount_v200C.${VERSION}.root"
    set_ref: validation_151X

  nugun_ratectl2_files:
    151X-vanilla: "plots/histos_nugun_alleta_pu200_egrate_v200A.140Xv0D0.root"
    151X-AR2025: "plots/histos_nugun_alleta_pu200_egrate_v200C.140Xv0E8.root"
    151Xpre4: "plots/histos_nugun_alleta_pu200_egrate_v200C.140Xv0F0.root"
    "${TARGET_VERSION}": "plots/histos_nugun_alleta_pu200_egrate_v200C.${TARGET_VERSION}.root"
    # template: "plots/histos_nugun_alleta_pu200_egrate_v200C.${VERSION}.root"
    # set_ref: validation_151X

  nugun_metrate_files:
    template: "plots/histos_nugun_alleta_pu200_jmratemet_v200A.${VERSION}.root"
    set_ref: validation_151X

  nugun_jetrate_files:
    template: "plots/histos_nugun_alleta_pu200_jmratejets_v200A.${VERSION}.root"
    set_ref: validation_151X

  ttbar_jetreso_files:
    template: "plots/histos_ttbar_PU200_jets_v200C.${VERSION}.root"
    set_ref: validation_151X


# Tasks replicate the old shell logic
tasks:
  eg_reso:
    module: cfg/eg_genmatch_draw.py
    what: reso_ctl2
    inputs_ref: gen_match_ele_files

  eg_rate_menu:
    module: cfg/eg_rate_draw.py
    what: menu_rate
    inputs_ref: nugun_ratemenu_files

  eg_eff_ctl2:
    module: cfg/eg_genmatch_draw.py
    what: eff_ctl2
    inputs_ref: gen_match_ele_files

  eg_eff_menu:
    module: cfg/eg_genmatch_draw.py
    what: eff_menu_ele
    inputs_ref: gen_match_menu_ele_files

  ctl2_eg_rate:
    module: cfg/eg_rate_draw.py
    what: ctl2_rate
    inputs_ref: nugun_ratectl2_files

  eg_unmatched:
    module: cfg/egplots_draw.py
    what: tkeg_plots
    inputs_ref: nomatch_ele_files

  counter:
    module: cfg/eg_rate_draw.py
    what: menu_ratecounter
    inputs_ref: nugun_egratecount_files
    exclude_from_all: true  # mimic shell exclusion of 'counter' from 'all'

  met_rate:
    module: cfg/jetmet_rate_draw.py
    what: met
    inputs_ref: nugun_metrate_files

  jet_rate:
    module: cfg/jetmet_rate_draw.py
    what: jets
    inputs_ref: nugun_jetrate_files

  jet_reso:
    module: cfg/jetmet_genmatch_draw.py
    what: jet_reso
    inputs_ref: ttbar_jetreso_files

  jet_eff:
    module: cfg/jetmet_genmatch_draw.py
    what: jet_eff
    inputs_ref: ttbar_jetreso_files

groups:
  eg_genmatch:
    - eg_reso
    - eg_eff_ctl2
    - eg_eff_menu
    - eg_ton_ele
    - eg_ton_pho

  eg_rate:
    - eg_rate_menu
    - ctl2_eg_rate
    - counter

  eg_all:
    - eg_reso
    - eg_rate_menu
    - eg_eff_ctl2
    - eg_eff_menu
    - ctl2_eg_rate
    - eg_unmatched
    - counter
    - eg_ton_ele
    - eg_ton_pho

  jetmet:
    - met_rate
    - jet_rate
    - jet_reso
    - jet_eff
